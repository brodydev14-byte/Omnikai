<!DOCTYPE html>
<html lang="en">
<head>
  <script src="theme.js"></script>
  <script src="omni-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="omni-auth.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Omnikai – Set a New Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#080b10; --blue:#00c8ff; --blue-glow:rgba(0,200,255,0.18);
      --blue-glow-strong:rgba(0,200,255,0.35); --white:#f0f4f8;
      --muted:#5a6a7a; --border:rgba(0,200,255,0.15); --error:#ff4560;
    }
    html, body { height:100%; background:var(--bg); color:var(--white); font-family:'Rajdhani',sans-serif; }
    .bg-layer { position:fixed; inset:0; z-index:0; background: radial-gradient(ellipse 70% 50% at 50% 10%, rgba(0,200,255,0.05) 0%, transparent 70%), #080b10; }
    .grid-lines {
      position:fixed; inset:0; z-index:0;
      background-image:
        linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
      background-size:48px 48px;
    }
    .page { position:relative; z-index:1; height:100vh; display:flex; align-items:center; justify-content:center; padding:32px; }
    .card { width:100%; max-width:420px; }
    .logo-mark { display:flex; align-items:center; gap:16px; margin-bottom:10px; }
    .logo-icon {
      width:56px; height:56px; border:2px solid var(--blue); border-radius:12px; overflow:hidden;
      box-shadow:0 0 18px var(--blue-glow-strong), inset 0 0 12px var(--blue-glow);
    }
    .logo-icon img { width:100%; height:100%; object-fit:cover; }
    .logo-name { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:0.12em; }
    .logo-name span { color:var(--blue); }
    .tagline {
      font-family:'Inter',sans-serif; font-size:0.72rem; font-weight:300; letter-spacing:0.22em;
      text-transform:uppercase; color:var(--muted); margin-bottom:40px;
    }
    h1 { font-family:'Bebas Neue',sans-serif; font-size:1.7rem; letter-spacing:0.08em; margin-bottom:8px; }
    .sub { font-family:'Inter',sans-serif; font-size:0.85rem; font-weight:300; color:var(--muted); margin-bottom:26px; line-height:1.6; }
    .field { margin-bottom:18px; }
    .field label {
      display:block; font-size:0.72rem; font-weight:600; letter-spacing:0.18em;
      text-transform:uppercase; color:var(--muted); margin-bottom:7px;
    }
    .field input {
      width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--border);
      border-radius:6px; padding:13px 16px; color:var(--white);
      font-family:'Inter',sans-serif; font-size:0.95rem; outline:none;
      transition:border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .field input:focus { border-color:var(--blue); background:rgba(0,200,255,0.04); box-shadow:0 0 0 3px var(--blue-glow); }
    .msg {
      display:none; font-family:'Inter',sans-serif; font-size:0.82rem; line-height:1.5;
      border-radius:6px; padding:10px 13px; margin-bottom:14px;
    }
    .msg.show { display:block; }
    .msg.error { color:var(--error); background:rgba(255,69,96,0.08); border:1px solid rgba(255,69,96,0.3); }
    .msg.ok { color:var(--blue); background:rgba(0,200,255,0.06); border:1px solid var(--border); }
    .submit-btn {
      width:100%; background:var(--blue); border:none; border-radius:6px; padding:14px;
      color:#080b10; font-family:'Bebas Neue',sans-serif; font-size:1.15rem; letter-spacing:0.18em;
      cursor:pointer; transition:background 0.2s, box-shadow 0.2s;
      box-shadow:0 0 24px var(--blue-glow-strong), 0 0 60px rgba(0,200,255,0.25);
    }
    .submit-btn:hover:not(:disabled) { background:#1ad4ff; }
    .submit-btn:disabled { opacity:0.55; cursor:not-allowed; box-shadow:none; }
    .back { display:block; text-align:center; margin-top:20px; font-size:0.82rem; color:var(--muted); text-decoration:none; }
    .back:hover { color:var(--blue); }
  </style>
</head>
<body>

<div class="bg-layer"></div>
<div class="grid-lines"></div>

<div class="page">
  <div class="card">
    <div class="logo-mark">
      <div class="logo-icon"><img src="logo.png" alt="Omnikai Logo"/></div>
      <div class="logo-name">OMNI<span>KAI</span></div>
    </div>
    <div class="tagline">Train Every Art &nbsp;·&nbsp; Master Every Form</div>

    <h1>SET A NEW PASSWORD</h1>
    <p class="sub">Choose something at least 8 characters long. You'll be taken straight to your dashboard.</p>

    <form onsubmit="handleReset(event)">
      <div class="field">
        <label for="pw">New Password</label>
        <input id="pw" type="password" autocomplete="new-password" required minlength="8" placeholder="••••••••"/>
      </div>
      <div class="field">
        <label for="pw2">Confirm Password</label>
        <input id="pw2" type="password" autocomplete="new-password" required minlength="8" placeholder="••••••••"/>
      </div>
      <div class="msg" id="msg"></div>
      <button class="submit-btn" type="submit" id="btn">Update Password</button>
    </form>

    <a class="back" href="index.html">Back to login</a>
  </div>
</div>

<script>
  function say(text, kind) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg show ' + kind;
  }

  // Supabase puts a recovery session in the URL fragment; detectSessionInUrl
  // consumes it. If there's no session here, the link was bad or already used.
  window.addEventListener('load', async () => {
    if (!window.OmniAuth || !OmniAuth.configured) {
      say('Sign-in is not configured yet — add your Supabase keys to omni-config.js.', 'error');
      document.getElementById('btn').disabled = true;
      return;
    }
    const { data } = await OmniAuth.client.auth.getSession();
    if (!data.session) {
      say('This reset link is invalid or has expired. Request a new one from the login page.', 'error');
      document.getElementById('btn').disabled = true;
    }
  });

  async function handleReset(e) {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;

    if (pw !== pw2) { say('Those passwords do not match.', 'error'); return; }
    if (pw.length < 8) { say('Password must be at least 8 characters.', 'error'); return; }

    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'UPDATING…';

    const { error } = await OmniAuth.updatePassword(pw);

    if (error) {
      say(error.message, 'error');
      btn.disabled = false; btn.textContent = 'Update Password';
      return;
    }
    say('Password updated. Taking you to your dashboard…', 'ok');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
  }
</script>
</body>
</html>
