<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Omnikai – Workout Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#080b10; --blue:#00c8ff; --blue-glow:rgba(0,200,255,0.18);
      --blue-glow-strong:rgba(0,200,255,0.35); --white:#f0f4f8;
      --muted:#5a6a7a; --border:rgba(0,200,255,0.15); --card:rgba(255,255,255,0.03);
      --nav-h:72px; --locked:rgba(255,255,255,0.03);
    }
    html,body { min-height:100%; background:var(--bg); color:var(--white); font-family:'Rajdhani',sans-serif; overflow-x:hidden; }
    .bg-layer { position:fixed; inset:0; z-index:0; background:radial-gradient(ellipse 70% 40% at 50% 10%, rgba(0,200,255,0.05) 0%, transparent 70%), var(--bg); }
    .grid-lines { position:fixed; inset:0; z-index:0; background-image:linear-gradient(rgba(0,200,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,0.025) 1px,transparent 1px); background-size:48px 48px; }

    .scroll-wrap { position:relative; z-index:1; min-height:100vh; padding:24px 20px calc(var(--nav-h) + 24px); max-width:640px; margin:0 auto; }

    /* HEADER */
    .page-header { margin-bottom:24px; }
    .page-eyebrow { font-size:0.65rem; font-weight:700; letter-spacing:0.25em; text-transform:uppercase; color:var(--blue); margin-bottom:4px; }
    .page-title { font-family:'Bebas Neue',sans-serif; font-size:2.2rem; letter-spacing:0.06em; line-height:1; margin-bottom:4px; }
    .page-sub { font-family:'Inter',sans-serif; font-size:0.82rem; color:var(--muted); }

    /* PLAN BADGE */
    .plan-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(0,200,255,0.08); border:1px solid rgba(0,200,255,0.2); border-radius:999px; padding:4px 14px; font-size:0.7rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--blue); margin-bottom:20px; }

    /* ART FILTER TABS */
    .filter-scroll { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:24px; scrollbar-width:none; }
    .filter-scroll::-webkit-scrollbar { display:none; }
    .filter-tab { flex-shrink:0; padding:8px 16px; border-radius:999px; border:1px solid var(--border); background:var(--card); font-family:'Rajdhani',sans-serif; font-size:0.8rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); cursor:pointer; transition:all 0.2s; white-space:nowrap; }
    .filter-tab:hover { border-color:rgba(0,200,255,0.35); color:var(--white); }
    .filter-tab.active { background:var(--blue); border-color:var(--blue); color:#080b10; box-shadow:0 0 12px var(--blue-glow); }

    /* SECTION */
    .library-section { margin-bottom:32px; }
    .section-header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .section-emoji { font-size:1.3rem; }
    .section-title { font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:0.08em; }
    .section-count { font-size:0.7rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); margin-left:auto; }

    /* LEVEL TABS */
    .level-tabs { display:flex; gap:6px; margin-bottom:14px; }
    .level-tab { padding:5px 14px; border-radius:999px; border:1px solid var(--border); background:none; font-family:'Rajdhani',sans-serif; font-size:0.75rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); cursor:pointer; transition:all 0.2s; }
    .level-tab.active { border-color:var(--blue); color:var(--blue); background:rgba(0,200,255,0.08); }

    /* WORKOUT CARD */
    .workout-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
    .workout-card:hover { border-color:rgba(0,200,255,0.4); background:rgba(0,200,255,0.04); transform:translateX(4px); }
    .workout-card.locked { cursor:default; opacity:0.6; }
    .workout-card.locked:hover { transform:none; border-color:var(--border); background:var(--card); }
    .workout-card.completed { border-color:rgba(0,255,136,0.3); }
    .workout-card.completed::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:#00ff88; border-radius:3px 0 0 3px; }

    .wc-icon { width:44px; height:44px; border-radius:10px; background:rgba(0,200,255,0.08); border:1px solid rgba(0,200,255,0.2); display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex-shrink:0; }
    .wc-icon.locked-icon { background:rgba(255,255,255,0.03); border-color:rgba(255,255,255,0.08); filter:grayscale(1); }

    .wc-info { flex:1; min-width:0; }
    .wc-name { font-size:0.95rem; font-weight:700; letter-spacing:0.04em; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .wc-meta { display:flex; flex-wrap:wrap; gap:6px; }
    .wc-chip { font-family:'Inter',sans-serif; font-size:0.68rem; font-weight:500; color:var(--muted); }
    .wc-chip::after { content:'·'; margin-left:6px; }
    .wc-chip:last-child::after { content:''; }

    .wc-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
    .wc-level { font-size:0.62rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; padding:3px 8px; border-radius:999px; }
    .wc-level.beginner { background:rgba(0,255,136,0.1); color:#00ff88; border:1px solid rgba(0,255,136,0.2); }
    .wc-level.intermediate { background:rgba(255,170,0,0.1); color:#ffaa00; border:1px solid rgba(255,170,0,0.2); }
    .wc-level.advanced { background:rgba(255,69,96,0.1); color:#ff4560; border:1px solid rgba(255,69,96,0.2); }
    .wc-arrow { color:var(--blue); font-size:1rem; }

    /* LOCK BADGE */
    .lock-badge { display:flex; align-items:center; gap:5px; font-size:0.68rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }

    /* WARRIOR UPSELL */
    .upsell-card { background:linear-gradient(135deg, rgba(0,200,255,0.06) 0%, rgba(0,50,100,0.1) 100%); border:1px solid var(--blue); border-radius:12px; padding:20px 18px; margin-bottom:24px; }
    .upsell-title { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:0.06em; margin-bottom:6px; }
    .upsell-sub { font-family:'Inter',sans-serif; font-size:0.82rem; color:var(--muted); margin-bottom:14px; line-height:1.5; }
    .upsell-btn { background:var(--blue); border:none; border-radius:7px; padding:10px 20px; color:#080b10; font-family:'Bebas Neue',sans-serif; font-size:0.95rem; letter-spacing:0.15em; cursor:pointer; box-shadow:0 0 16px var(--blue-glow-strong); transition:all 0.2s; }
    .upsell-btn:hover { background:#1ad4ff; }

    /* EMPTY STATE */
    .empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-family:'Inter',sans-serif; font-size:0.88rem; }

    /* BOTTOM NAV */
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; height:var(--nav-h); background:rgba(8,11,16,0.95); border-top:1px solid var(--border); backdrop-filter:blur(16px); display:flex; align-items:center; justify-content:space-around; z-index:100; padding:0 8px; }
    .nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:8px 16px; border-radius:10px; transition:all 0.2s; flex:1; }
    .nav-icon { font-size:1.3rem; }
    .nav-label { font-size:0.58rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
    .nav-item.active .nav-icon { filter:drop-shadow(0 0 6px var(--blue)); }
    .nav-item.active .nav-label { color:var(--blue); }

    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
<div class="bg-layer"></div>
<div class="grid-lines"></div>

<div class="scroll-wrap">

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-eyebrow">Train Smart</div>
    <div class="page-title">Workout Library</div>
    <div class="page-sub">Your personalized workout collection</div>
  </div>

  <div class="plan-badge" id="planBadge">⚔️ Wanderer Plan</div>

  <!-- ART FILTER -->
  <div class="filter-scroll" id="filterTabs">
    <div class="filter-tab active" onclick="filterArt('all', this)">All</div>
    <!-- filled by JS based on user arts -->
  </div>

  <!-- LIBRARY CONTENT -->
  <div id="libraryContent">
    <!-- filled by JS -->
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item" onclick="window.location.href='dashboard.html'"><div class="nav-icon">🏠</div><div class="nav-label">Home</div></div>
  <div class="nav-item active"><div class="nav-icon">📚</div><div class="nav-label">Library</div></div>
  <div class="nav-item"><div class="nav-icon">📅</div><div class="nav-label">Plans</div></div>
  <div class="nav-item"><div class="nav-icon">⚔️</div><div class="nav-label">Challenges</div></div>
  <div class="nav-item" onclick="window.location.href='dashboard.html'"><div class="nav-icon">👤</div><div class="nav-label">Profile</div></div>
</div>

<script>
  const arts = JSON.parse(sessionStorage.getItem('omniArts') || '["Boxing","MMA","Muay Thai"]');
  const plan = sessionStorage.getItem('omniPlan') || 'wanderer';
  const isWarrior = plan === 'warrior';
  const bodyData = JSON.parse(sessionStorage.getItem('omniBody') || '{}');
  const equipment = JSON.parse(sessionStorage.getItem('omniEquipment') || '{}');
  const weight = parseFloat(bodyData.weight) || 160;
  const unit = bodyData.unit || 'imperial';
  const goal = (bodyData.goal || 'perform').toLowerCase();
  const weightLbs = unit === 'metric' ? weight * 2.205 : weight;
  const isHeavy = weightLbs > 170;
  const hasEquipment = Object.values(equipment).some(v => v === true);

  // Figure out which boxing session to recommend
  function getBoxingSession() {
    if (!hasEquipment) return 'boxing_beginner_d.html';
    if (goal === 'cut') return 'boxing_beginner_c.html';
    if (goal === 'bulk') return 'boxing_beginner_b.html';
    return 'boxing_beginner_a.html';
  }

  function getBoxingSessionName() {
    if (!hasEquipment) return 'Session D — No Equipment';
    if (goal === 'cut') return 'Session C — Conditioning Focus';
    if (goal === 'bulk') return 'Session B — Power Focus';
    return 'Session A — Technique Focus';
  }

  // Update plan badge
  if (isWarrior) document.getElementById('planBadge').textContent = '⚡ Warrior Plan';

  // Art emojis
  const artEmojis = {
    'MMA':'⚡','Muay Thai':'🦵','BJJ':'🥋','Boxing':'🥊',
    'Wrestling':'🤼','Judo':'👘','Karate':'🦶','Kung Fu':'🐉',
    'Krav Maga':'🛡️','Taekwondo':'🦶'
  };

  // Workout database
  const workoutDB = {
    'Boxing': [
      { id:'boxing_rec', name:`⭐ Recommended: ${getBoxingSessionName()}`, level:'beginner', duration:'35 min', focus:'Personalized', file:getBoxingSession(), available:true },
      { id:'boxing_beg_a', name:'Session A — Technique Focus', level:'beginner', duration:'35 min', focus:'Technique', file:'boxing_beginner_a.html', available:true },
      { id:'boxing_beg_b', name:'Session B — Power Focus', level:'beginner', duration:'35 min', focus:'Power', file:'boxing_beginner_b.html', available:true },
      { id:'boxing_beg_c', name:'Session C — Conditioning Focus', level:'beginner', duration:'40 min', focus:'Cardio', file:'boxing_beginner_c.html', available:true },
      { id:'boxing_beg_d', name:'Session D — No Equipment', level:'beginner', duration:'30 min', focus:'Shadowboxing', file:'boxing_beginner_d.html', available:true },
      { id:'boxing_int_combos', name:'Power Combination Drills', level:'intermediate', duration:'35 min', focus:'Striking', file:'', available:false, locked:!isWarrior },
      { id:'boxing_int_bag', name:'Heavy Bag Rounds', level:'intermediate', duration:'30 min', focus:'Conditioning', file:'', available:false, locked:!isWarrior },
      { id:'boxing_adv_sparring', name:'Sparring Prep — Full Combos', level:'advanced', duration:'45 min', focus:'Combat', file:'', available:false, locked:!isWarrior },
    ],
    'Muay Thai': [
      { id:'mt_beg_teep', name:'Teep & Jab Fundamentals', level:'beginner', duration:'25 min', focus:'Technique', file:'', available:false, comingSoon:true },
      { id:'mt_beg_kicks', name:'Basic Kick Drills', level:'beginner', duration:'20 min', focus:'Striking', file:'', available:false, comingSoon:true },
      { id:'mt_int_clinch', name:'Clinch & Knee Work', level:'intermediate', duration:'35 min', focus:'Grappling', file:'', available:false, locked:!isWarrior },
      { id:'mt_adv_combos', name:'Full Muay Thai Combinations', level:'advanced', duration:'45 min', focus:'Combat', file:'', available:false, locked:!isWarrior },
    ],
    'BJJ': [
      { id:'bjj_beg_solo', name:'Solo Drilling — Hip Escapes', level:'beginner', duration:'25 min', focus:'Movement', file:'', available:false, comingSoon:true },
      { id:'bjj_beg_bridges', name:'Bridges & Base Work', level:'beginner', duration:'20 min', focus:'Strength', file:'', available:false, comingSoon:true },
      { id:'bjj_int_guard', name:'Guard Retention Drills', level:'intermediate', duration:'35 min', focus:'Technique', file:'', available:false, locked:!isWarrior },
      { id:'bjj_adv_submissions', name:'Submission Chains', level:'advanced', duration:'40 min', focus:'Combat', file:'', available:false, locked:!isWarrior },
    ],
    'Wrestling': [
      { id:'wr_beg_sprawl', name:'Sprawl & Level Change', level:'beginner', duration:'20 min', focus:'Defense', file:'', available:false, comingSoon:true },
      { id:'wr_beg_core', name:'Anti-Rotation Core Training', level:'beginner', duration:'25 min', focus:'Strength', file:'', available:false, comingSoon:true },
      { id:'wr_int_shots', name:'Takedown Shot Drills', level:'intermediate', duration:'30 min', focus:'Offense', file:'', available:false, locked:!isWarrior },
    ],
    'MMA': [
      { id:'mma_beg_striking', name:'MMA Striking Basics', level:'beginner', duration:'25 min', focus:'Striking', file:'', available:false, comingSoon:true },
      { id:'mma_beg_conditioning', name:'MMA Conditioning Circuit', level:'beginner', duration:'30 min', focus:'Cardio', file:'', available:false, comingSoon:true },
      { id:'mma_int_transitions', name:'Strike to Takedown Combos', level:'intermediate', duration:'40 min', focus:'Combat', file:'', available:false, locked:!isWarrior },
    ],
    'Judo': [
      { id:'judo_beg_ukemi', name:'Ukemi — Safe Falling', level:'beginner', duration:'20 min', focus:'Safety', file:'', available:false, comingSoon:true },
      { id:'judo_beg_grips', name:'Grip Fighting Basics', level:'beginner', duration:'20 min', focus:'Technique', file:'', available:false, comingSoon:true },
      { id:'judo_int_throws', name:'Throw Combinations', level:'intermediate', duration:'35 min', focus:'Technique', file:'', available:false, locked:!isWarrior },
    ],
    'Karate': [
      { id:'karate_beg_kihon', name:'Kihon — Basic Strikes', level:'beginner', duration:'20 min', focus:'Technique', file:'', available:false, comingSoon:true },
      { id:'karate_beg_kata', name:'Basic Kata Practice', level:'beginner', duration:'25 min', focus:'Form', file:'', available:false, comingSoon:true },
      { id:'karate_int_kumite', name:'Kumite Drills', level:'intermediate', duration:'35 min', focus:'Combat', file:'', available:false, locked:!isWarrior },
    ],
    'Kung Fu': [
      { id:'kf_beg_forms', name:'Basic Form Training', level:'beginner', duration:'25 min', focus:'Technique', file:'', available:false, comingSoon:true },
      { id:'kf_beg_strikes', name:'Kung Fu Strike Drills', level:'beginner', duration:'20 min', focus:'Striking', file:'', available:false, comingSoon:true },
    ],
    'Krav Maga': [
      { id:'km_beg_awareness', name:'Situational Awareness Drills', level:'beginner', duration:'20 min', focus:'Mindset', file:'', available:false, comingSoon:true },
      { id:'km_beg_strikes', name:'Basic Defense Strikes', level:'beginner', duration:'25 min', focus:'Striking', file:'', available:false, comingSoon:true },
    ],
    'Taekwondo': [
      { id:'tkd_beg_kicks', name:'Basic Kick Technique', level:'beginner', duration:'20 min', focus:'Striking', file:'', available:false, comingSoon:true },
      { id:'tkd_beg_forms', name:'Poomsae Basics', level:'beginner', duration:'25 min', focus:'Form', file:'', available:false, comingSoon:true },
    ],
  };

  let currentFilter = 'all';

  // Build filter tabs
  const filterScroll = document.getElementById('filterTabs');
  arts.forEach(art => {
    const tab = document.createElement('div');
    tab.className = 'filter-tab';
    tab.textContent = `${artEmojis[art] || ''} ${art}`;
    tab.onclick = () => filterArt(art, tab);
    filterScroll.appendChild(tab);
  });

  // Only show arts user selected (plus locked ones as upsell for wanderer)
  function filterArt(art, el) {
    currentFilter = art;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderLibrary();
  }

  function renderLibrary() {
    const content = document.getElementById('libraryContent');
    content.innerHTML = '';

    const artsToShow = currentFilter === 'all' ? arts : [currentFilter];

    // Show upsell if wanderer
    if (!isWarrior) {
      const upsell = document.createElement('div');
      upsell.className = 'upsell-card';
      upsell.innerHTML = `
        <div class="upsell-title">⚡ Unlock Warrior</div>
        <div class="upsell-sub">Get access to intermediate and advanced workouts, all martial arts, personalized plans and full progress tracking for $9.99/month.</div>
        <button class="upsell-btn">Upgrade to Warrior →</button>
      `;
      content.appendChild(upsell);
    }

    artsToShow.forEach(art => {
      const workouts = workoutDB[art];
      if (!workouts) return;

      const section = document.createElement('div');
      section.className = 'library-section';

      const availableCount = workouts.filter(w => w.available).length;
      section.innerHTML = `
        <div class="section-header">
          <div class="section-emoji">${artEmojis[art] || '🥋'}</div>
          <div class="section-title">${art}</div>
          <div class="section-count">${availableCount} available</div>
        </div>
      `;

      workouts.forEach(w => {
        const card = document.createElement('div');
        card.className = `workout-card${w.locked ? ' locked' : ''}`;

        if (w.available && w.file) {
          card.onclick = () => window.location.href = w.file;
        } else if (w.locked) {
          card.onclick = () => alert('⚡ Upgrade to Warrior to unlock this workout!');
        }

        card.innerHTML = `
          <div class="wc-icon ${w.locked ? 'locked-icon' : ''}">${artEmojis[art] || '🥋'}</div>
          <div class="wc-info">
            <div class="wc-name">${w.name}</div>
            <div class="wc-meta">
              <span class="wc-chip">⏱ ${w.duration}</span>
              <span class="wc-chip">🏷 ${w.focus}</span>
              ${w.comingSoon ? '<span class="wc-chip" style="color:var(--blue);">Coming Soon</span>' : ''}
            </div>
          </div>
          <div class="wc-right">
            <div class="wc-level ${w.level}">${w.level}</div>
            ${w.locked ? '<div class="lock-badge">🔒 Warrior</div>' : w.available ? '<div class="wc-arrow">→</div>' : '<div class="wc-arrow" style="color:var(--muted);">—</div>'}
          </div>
        `;
        section.appendChild(card);
      });

      content.appendChild(section);
    });
  }

  renderLibrary();
</script>
</body>
</html>
