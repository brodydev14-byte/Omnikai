<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Omnikai – Train Every Art. Master Every Form.</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080b10;
      --bg2: #0d1117;
      --blue: #00c8ff;
      --blue-dim: #0090bb;
      --blue-glow: rgba(0, 200, 255, 0.18);
      --blue-glow-strong: rgba(0, 200, 255, 0.35);
      --white: #f0f4f8;
      --muted: #5a6a7a;
      --border: rgba(0, 200, 255, 0.15);
      --error: #ff4560;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }

    /* ── BACKGROUND ── */
    .bg-layer {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 70% 40%, rgba(0,200,255,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 10% 80%, rgba(0,100,180,0.08) 0%, transparent 60%),
        var(--bg);
    }

    /* animated grid */
    .grid-lines {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridDrift 20s linear infinite;
    }
    @keyframes gridDrift {
      0%   { transform: translateY(0); }
      100% { transform: translateY(48px); }
    }

    /* diagonal accent bar */
    .accent-bar {
      position: fixed;
      top: -10%; left: 55%;
      width: 3px; height: 130%;
      background: linear-gradient(180deg, transparent 0%, var(--blue) 40%, transparent 100%);
      opacity: 0.12;
      transform: rotate(12deg);
      z-index: 0;
    }

    /* ── LAYOUT ── */
    .page {
      position: relative; z-index: 1;
      display: flex;
      height: 100vh;
    }

    /* LEFT PANEL */
    .left-panel {
      flex: 1.3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 72px;
      max-width: 600px;
    }

    .brand {
      margin-bottom: 56px;
    }

    .logo-mark {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 12px;
    }

    .logo-icon {
      width: 68px; height: 68px;
      border: 2px solid var(--blue);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 18px var(--blue-glow-strong), inset 0 0 12px var(--blue-glow);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 18px var(--blue-glow-strong), inset 0 0 12px var(--blue-glow); }
      50%       { box-shadow: 0 0 32px rgba(0,200,255,0.5), inset 0 0 20px rgba(0,200,255,0.25); }
    }

    .logo-icon img { width: 100%; height: 100%; object-fit: cover; }

    .logo-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 0.12em;
      color: var(--white);
    }
    .logo-name span { color: var(--blue); }

    .tagline {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      background: none; border: none; cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 24px 12px;
      position: relative;
      transition: color 0.25s;
    }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 2px;
      background: var(--blue);
      box-shadow: 0 0 8px var(--blue);
      transform: scaleX(0);
      transition: transform 0.25s;
    }
    .tab-btn.active { color: var(--blue); }
    .tab-btn.active::after { transform: scaleX(1); }

    /* FORM */
    .form-panel { display: none; }
    .form-panel.active { display: block; animation: fadeUp 0.3s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 13px 16px;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .field input::placeholder { color: var(--muted); }
    .field input:focus {
      border-color: var(--blue);
      background: rgba(0,200,255,0.04);
      box-shadow: 0 0 0 3px var(--blue-glow);
    }

    .forgot {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 20px;
    }
    .forgot a {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot a:hover { color: var(--blue); }

    .submit-btn {
      width: 100%;
      background: var(--blue);
      border: none;
      border-radius: 6px;
      padding: 14px;
      color: #080b10;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.18em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      box-shadow: 0 0 24px var(--blue-glow-strong), 0 0 60px rgba(0,200,255,0.25), 0 0 100px rgba(0,200,255,0.1);
    }
    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.4s;
    }
    .submit-btn:hover { background: #1ad4ff; box-shadow: 0 0 36px rgba(0,200,255,0.6), 0 0 80px rgba(0,200,255,0.35), 0 0 120px rgba(0,200,255,0.15); transform: translateY(-1px); }
    .submit-btn:hover::before { left: 100%; }
    .submit-btn:active { transform: translateY(0); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 22px 0;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px;
      background: var(--border);
    }

    .social-btn {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      color: var(--white);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: border-color 0.2s, background 0.2s;
    }
    .social-btn:hover { border-color: var(--blue); background: var(--blue-glow); }

    /* RIGHT PANEL */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }

    .hero-text {
      text-align: center;
      z-index: 1;
    }

    .hero-eyebrow {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 18px;
    }

    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 6vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: 0.04em;
      color: var(--white);
      margin-bottom: 24px;
    }
    .hero-title .highlight {
      color: var(--blue);
      text-shadow: 0 0 40px rgba(0,200,255,0.4);
    }

    .hero-desc {
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 300;
      line-height: 1.7;
      color: var(--muted);
      max-width: 340px;
      margin: 0 auto 40px;
    }

    /* discipline pills */
    .disciplines {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 48px;
    }
    .pill {
      background: rgba(0,200,255,0.06);
      border: 1px solid rgba(0,200,255,0.2);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue);
      animation: pillIn 0.5s ease both;
    }
    .pill:nth-child(1) { animation-delay: 0.1s; }
    .pill:nth-child(2) { animation-delay: 0.2s; }
    .pill:nth-child(3) { animation-delay: 0.3s; }
    .pill:nth-child(4) { animation-delay: 0.4s; }
    .pill:nth-child(5) { animation-delay: 0.5s; }
    .pill:nth-child(6) { animation-delay: 0.6s; }
    .pill:nth-child(7) { animation-delay: 0.7s; }
    @keyframes pillIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* stats row */
    .stats {
      display: flex; gap: 40px;
    }
    .stat { text-align: center; }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: var(--blue);
      line-height: 1;
      text-shadow: 0 0 20px var(--blue-glow-strong);
    }
    .stat-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── OCTAGON + ENERGY ── */
    .octagon-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .octagon-svg {
      width: min(520px, 80%);
      height: min(520px, 80%);
      animation: octoSpin 30s linear infinite;
    }
    @keyframes octoSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .octo-main {
      stroke: var(--blue);
      stroke-width: 1.5;
      fill: none;
      filter: drop-shadow(0 0 10px #00c8ff) drop-shadow(0 0 30px rgba(0,200,255,0.4));
      animation: octoPulse 3s ease-in-out infinite;
    }
    .octo-inner {
      stroke: rgba(0,200,255,0.3);
      stroke-width: 0.8;
      fill: none;
      animation: octoPulse 3s ease-in-out infinite reverse;
    }
    @keyframes octoPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.5; }
    }

    /* energy aura layers */
    .aura {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .aura-1 {
      width: 340px; height: 340px;
      background: radial-gradient(circle, rgba(0,200,255,0.12) 0%, transparent 70%);
      animation: auraBreath 4s ease-in-out infinite;
    }
    .aura-2 {
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(0,200,255,0.18) 0%, transparent 65%);
      animation: auraBreath 4s ease-in-out infinite 1s;
    }
    .aura-3 {
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(0,200,255,0.28) 0%, transparent 60%);
      animation: auraBreath 4s ease-in-out infinite 2s;
    }
    @keyframes auraBreath {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%       { transform: scale(1.15); opacity: 0.6; }
    }

    /* energy sparks */
    .spark {
      position: absolute;
      width: 3px; height: 3px;
      background: var(--blue);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--blue), 0 0 12px var(--blue);
      animation: sparkFloat 5s ease-in-out infinite;
    }
    .spark:nth-child(1) { top: 30%; left: 48%; animation-delay: 0s;   animation-duration: 4s; }
    .spark:nth-child(2) { top: 55%; left: 60%; animation-delay: 1s;   animation-duration: 6s; }
    .spark:nth-child(3) { top: 65%; left: 42%; animation-delay: 2s;   animation-duration: 5s; }
    .spark:nth-child(4) { top: 40%; left: 62%; animation-delay: 0.5s; animation-duration: 7s; }
    .spark:nth-child(5) { top: 48%; left: 38%; animation-delay: 1.5s; animation-duration: 4.5s; }
    @keyframes sparkFloat {
      0%   { transform: translateY(0)    scale(1);   opacity: 1; }
      50%  { transform: translateY(-20px) scale(1.5); opacity: 0.7; }
      100% { transform: translateY(-40px) scale(0);   opacity: 0; }
    }

    /* PAGE ENTRANCE */
    .left-panel  { animation: slideInLeft  0.6s cubic-bezier(0.22,1,0.36,1) both; }
    .right-panel { animation: slideInRight 0.6s cubic-bezier(0.22,1,0.36,1) 0.1s both; }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* responsive */
    @media (max-width: 860px) {
      .right-panel { display: none; }
      .left-panel  { max-width: 100%; padding: 40px 32px; }
    }
  </style>
</head>

  <!-- RIGHT: HERO PANEL -->

      <div class="stats">

<script>
  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(tab).classList.add('active');
  }

  function handleLogin() {
    // Placeholder — will connect to plan selection page next

</script>
